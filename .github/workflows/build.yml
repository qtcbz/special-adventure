name: Build AUR packages
on:
  push:
    paths: ['packages/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:
concurrency:
  # Per branch: a test build of a review branch must not replace a pending
  # main build (GitHub keeps only the newest pending run in a group).
  # Superseded main runs are fine to drop, since each main build is cumulative.
  group: aur-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every package is built for three CPU targets (see scripts/build.sh):
  # x86-64-v3 first, as the baseline, then x86-64-v4 and znver4, which reuse
  # the baseline for packages that don't compile anything.
  # These jobs run AUR code (PKGBUILDs), so they only get a read-only token.
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: x86-64-v3
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aur-repo-x86-64-v3
          path: /srv/aur/
          retention-days: 3
          if-no-files-found: error

  build-optimized:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [x86-64-v4, znver4]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ matrix.target }}
      BASE_DIR: /srv/aur-base
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aur-repo-x86-64-v3
          path: /srv/aur-base
      - name: Build
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aur-repo-${{ matrix.target }}
          path: /srv/aur/
          retention-days: 3
          if-no-files-found: error

  # Has write access, but never runs anything from the AUR: it only uploads
  # the files the build jobs produced. It runs only if all three targets
  # built, so the repos never drift apart.
  publish:
    needs: [build, build-optimized]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aur-repo-*
          path: aur-out
      # Baseline first: the other repos fall back to it for skipped packages.
      - name: Publish x86-64-v3 (release "repo")
        run: bash scripts/publish.sh aur-out/aur-repo-x86-64-v3 repo x86-64-v3
      - name: Publish x86-64-v4
        run: bash scripts/publish.sh aur-out/aur-repo-x86-64-v4 repo-x86-64-v4 x86-64-v4
      - name: Publish znver4
        run: bash scripts/publish.sh aur-out/aur-repo-znver4 repo-znver4 znver4
